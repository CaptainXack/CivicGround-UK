name: Public legal source change monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: legal-source-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python monitor_sources.py
      - name: Publish report to repository
        run: |
          git config user.name 'legal-source-monitor[bot]'
          git config user.email 'legal-source-monitor[bot]@users.noreply.github.com'
          git add updates.json
          if ! git diff --cached --quiet; then git commit -m 'Update public-source comparison report' && git push; fi
