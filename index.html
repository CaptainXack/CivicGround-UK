<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10171f"><meta name="description" content="Police rights and responsibilities in England and Wales. Independent legal education."><title>CivicGround UK v4 | Police rights guide</title><style>
:root{color-scheme:dark;--bg:#10171f;--panel:#19242e;--line:#30414e;--muted:#aebfc9;--text:#f5f7f7;--accent:#f5a76b;--green:#8cdbc7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}a{color:var(--green);overflow-wrap:anywhere}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:3px}header{position:sticky;top:0;background:#10171ff5;backdrop-filter:blur(12px);z-index:3;border-bottom:1px solid var(--line)}.wrap{max-width:900px;margin:auto;padding:16px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:950;letter-spacing:-1.2px;font-size:23px;line-height:1}.logo em{color:var(--accent);font-style:normal}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:750;color:var(--green)}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--muted)}main{padding-bottom:100px!important}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(32px,7vw,52px);letter-spacing:-1.8px;line-height:1.04}h2{font-size:26px;line-height:1.2;letter-spacing:-.7px}h3{font-size:17px;line-height:1.3}p{color:var(--muted)}.hero{background:radial-gradient(ellipse at 100% 0%,#3c332c 0,transparent 60%),var(--panel);border:1px solid var(--line);border-radius:22px;padding:25px;margin:8px 0 20px}.hero p{max-width:600px}.btn{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:700;text-align:left;min-height:46px}.btn.primary{background:var(--accent);color:#19120c;border-color:var(--accent)}.btn.small{font-size:14px;padding:8px 12px}.btn.wide{width:100%;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid var(--line);background:var(--panel);padding:16px;border-radius:15px;margin:10px 0}.item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin:8px 0}.item .num{color:var(--accent);font-size:13px;font-weight:800;min-width:27px}.item .arrow{margin-left:auto;color:var(--muted)}.item strong{display:block;font-size:16px}.item small{color:var(--muted);display:block;font-size:12px}.notice{border-left:3px solid var(--green);padding:10px 13px;background:#182a30;border-radius:0 10px 10px 0;font-size:14px;margin:14px 0;color:var(--text)}.note{font-size:13px;color:var(--muted)}.section{margin-top:24px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{font-size:12px;display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:13px;margin:8px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.filter{border:1px solid var(--line);border-radius:99px;background:none;padding:7px 11px;font-size:13px}.filter.active{background:var(--green);border-color:var(--green);color:#10241e;font-weight:700}.quote{font-size:21px;line-height:1.35;font-weight:700;color:var(--text);padding:15px 0 8px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--green);font-weight:800}.detail p{color:var(--text);margin:5px 0 0}.detail .card{padding:18px}.law{font-size:15px;font-weight:650;line-height:1.5}.sources a{display:block;padding:9px 0;border-bottom:1px solid var(--line)}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#10171ff5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav .navwrap{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:none;border:0;color:var(--muted);font-size:11px;min-height:62px;padding:6px 2px}nav button span{display:block;font-size:20px;line-height:1.1;margin-bottom:4px}nav button.active{color:var(--accent);font-weight:800}label{display:block;font-weight:650;margin-top:12px}textarea,input[type=text],select{width:100%;background:#10171f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}textarea{min-height:90px;resize:vertical}.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini .card{margin:0}.count{font-size:30px;font-weight:850;color:var(--accent)}.empty{padding:24px 0;text-align:center;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:450px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.hero{padding:20px}.tag{font-size:10px}.quote{font-size:19px}}@media print{header,nav,button,.notice{display:none}body{background:white;color:black}p,.detail p,.kicker,.law,a{color:black}.card,.hero{background:white;border:1px solid #bbb}main{padding:0!important}}

:root{--reading:16px}body{font-size:var(--reading)}.item strong{font-size:var(--reading)}.card p{font-size:var(--reading)}.checkrow{display:flex;align-items:flex-start;gap:12px;border-top:1px solid var(--line);padding:12px 0;margin:0}.checkrow input{width:22px;height:22px;flex:none;accent-color:var(--green)}.contrast{--bg:#000;--panel:#111;--line:#888;--muted:#fff;--text:#fff;--accent:#ffe38a;--green:#baffdf}.contrast header,.contrast nav{background:#000}.item:disabled{opacity:.75;cursor:default}.hero{position:relative;overflow:hidden}.hero:after{content:'§';position:absolute;right:12px;bottom:-70px;font-size:230px;color:#ffffff06;pointer-events:none}.hero>*{position:relative;z-index:1}.item:hover,.btn:hover{border-color:var(--green)}@media(prefers-reduced-motion:no-preference){.item,.btn{transition:border-color .15s,background .15s}}

@media(max-width:500px){.card .mini{grid-template-columns:1fr}.card .mini>div+div{border-top:1px solid var(--line);padding-top:12px}}@media print{body:has(.pocket) main>*:not(.pocket){display:none!important}.pocket{max-width:100%;border:none!important}.pocket h2,.pocket h3{color:black}.pocket p{color:black}}

.v4timeline{border-left:2px solid var(--line);margin-left:12px;padding-left:20px}.v4timeline .card{position:relative}.v4timeline .card:before{content:'';position:absolute;left:-29px;top:23px;width:13px;height:13px;border-radius:50%;background:var(--green);border:3px solid var(--bg)}.v4stat{font-size:24px;font-weight:850;color:var(--accent)}.v4step{color:var(--green);font-size:12px;font-weight:700;letter-spacing:1px}.v4answer{margin-top:12px}.audioBar{margin-bottom:12px}.ranknum{font-size:14px;color:var(--green);font-weight:800;min-width:28px}.easy-mode .detail .quote{font-size:1.2em}.easy-mode .detail .card{padding:14px}.v4lawrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.v4lawrow a{display:inline-block;padding:8px 0}.light{color-scheme:light;--bg:#f4f6f7;--panel:#fff;--line:#a9b7c0;--muted:#374b58;--text:#15232d;--accent:#9a470e;--green:#136b5a}.light header,.light nav{background:#f4f6f7f5}.light .btn.primary{color:white}.light .notice{background:#e5f2ee}.light textarea,.light input[type=text],.light select{background:white;color:var(--text)}.light .filter.active{color:white}.light .hero{background:var(--panel)}.light .hero:after{color:#00000008}progress{max-width:100%}.v4choice{margin-top:12px}.v4source{margin-top:12px;display:block}.v4legal{overflow-wrap:anywhere}.v4reading{font-size:var(--reading)}@media print{.audioBar{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><header><div class="wrap top"><div><div class="logo">CIVIC<em>GROUND</em> UK</div><div class="eyebrow">Rights · Responsibilities</div></div><span class="tag">England & Wales</span></div></header><main id="main" class="wrap" tabindex="-1"></main><nav aria-label="Main navigation"><div class="navwrap" id="nav"></div></nav><script id="data" type="application/json">{"items": [{"id": 1, "title": "An officer asks you questions", "cat": "Street encounters", "situation": "You are walking home and an officer asks where you are going.", "say": "“Am I free to leave, or am I being detained?”", "law": "An ordinary conversation is not automatically detention. Police can ask for information, but a legal power is needed to keep someone there against their will. A separate legal duty may apply in particular circumstances.", "next": "Ask calmly whether you are free to leave. If told you are detained, stay calm and ask what power applies. If you are a child, ask to contact a trusted adult.", "basis": "PACE Code A; HRA Art. 5", "refs": [{"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "page": 4}, {"id": 2, "title": "Asked for your name or ID", "cat": "Street encounters", "situation": "An officer asks to see your ID while you wait for a bus.", "say": "“Is this a request, or am I legally required to give my details?”", "law": "There is no universal requirement to carry ID or give your name in ordinary street questioning. Particular laws create duties, including certain road traffic and anti-social behaviour situations.", "next": "Ask whether this is a request or a legal requirement. Provide truthful information where required; never give false details.", "basis": "Police Reform Act 2002 s.50; RTA ss.164–165", "refs": [{"name": "PRA", "url": "https://www.legislation.gov.uk/ukpga/2002/30"}, {"name": "RTA", "url": "https://www.legislation.gov.uk/ukpga/1988/52"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}], "page": 4}, {"id": 3, "title": "Anti-social behaviour allegation", "cat": "Street encounters", "situation": "A uniformed officer says a resident reported antisocial behaviour and asks for your name and address.", "say": "“What behaviour are you referring to? I understand I must give details if the legal requirement applies.”", "law": "A uniformed constable with reason to believe you have engaged in anti-social behaviour can require your name and address. From 26 October 2026 the definition covers harassment, alarm or distress (including likely effects), and specified housing-related conduct. Refusing required details or giving inaccurate details is an offence.", "next": "Ask what conduct is alleged and comply with a lawful requirement. Tell a trusted adult if you think the power was misused.", "basis": "Police Reform Act 2002 s.50(1)-(2), amended by Crime and Policing Act 2026 Sch. 1 para. 26", "refs": [{"name": "Section 50", "url": "https://www.legislation.gov.uk/ukpga/2002/30/section/50"}, {"name": "2026 commencement", "url": "https://www.legislation.gov.uk/uksi/2026/960/regulation/4"}, {"name": "PRA", "url": "https://www.legislation.gov.uk/ukpga/2002/30"}, {"name": "ASB", "url": "https://www.legislation.gov.uk/ukpga/2014/12"}], "page": 5}, {"id": 4, "title": "Plain-clothes officer approaches", "cat": "Street encounters", "situation": "Someone in ordinary clothes says they are a police officer and intends to search you.", "say": "“Could I see your police identification, please?”", "law": "A plain-clothes constable conducting a statutory stop and search must produce documentary evidence of their police status. Other encounters have different rules.", "next": "Politely ask to see identification. If unsure whether someone is genuine, seek help from a trusted adult or call 101 to verify; call 999 if in immediate danger.", "basis": "PACE s.2; Code A", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}], "page": 5}, {"id": 5, "title": "Ordinary PACE search", "cat": "Stop and search", "situation": "An officer says you match a description from a recent theft and wants to search your bag.", "say": "“What are the grounds for the search, and what are you looking for?”", "law": "Section 1 permits searches for specified items, including stolen or prohibited articles, on reasonable grounds. Grounds must be objectively supportable; an officer’s hunch alone is not enough.", "next": "Ask for the reason, object and legal power. Remain still, do not physically resist, and ask for the search record.", "basis": "PACE ss.1–3; Code A", "refs": [{"name": "PACE section 1", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/1"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}, {"name": "Search", "url": "https://www.gov.uk/police-powers-to-stop-and-search-your-rights"}], "page": 6}, {"id": 6, "title": "A search based on another statute", "cat": "Stop and search", "situation": "An officer says the search is being carried out under a law other than PACE.", "say": "“Which Act and section are you using, please?”", "law": "Different laws permit searches for different categories of items, generally where their own statutory conditions are met. The officer must use a power that matches the purpose.", "next": "Ask which statute is being used and what is being sought. Do not handle or reach for items during a search.", "basis": "MDA s.23; Firearms Act s.47", "refs": [{"name": "MDA", "url": "https://www.legislation.gov.uk/ukpga/1971/38"}, {"name": "FA", "url": "https://www.legislation.gov.uk/ukpga/1968/27"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}], "page": 6}, {"id": 7, "title": "Section 60 area authorisation", "cat": "Stop and search", "situation": "An officer says a temporary section 60 search authorisation is in force in the area.", "say": "“Can you explain the authorisation and give me the search record?”", "law": "A properly authorised section 60 search can be conducted in a designated area and period without individual reasonable suspicion. It has a limited statutory purpose and is not an unrestricted search power.", "next": "Ask for the power and purpose, and request a record. Do not treat the absence of personal suspicion as proof the search is unlawful.", "basis": "CJPOA s.60; Code A", "refs": [{"name": "Section 60", "url": "https://www.legislation.gov.uk/ukpga/1994/33/section/60"}, {"name": "CJPOA", "url": "https://www.legislation.gov.uk/ukpga/1994/33"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}], "page": 7}, {"id": 8, "title": "Search information and records", "cat": "Stop and search", "situation": "A street search finishes, but you do not know how to obtain the paperwork.", "say": "“Could I have the search reference and instructions for obtaining the record?”", "law": "Before a routine search, police normally explain the grounds (or authorisation), object, legal power, identity, station, detention and right to a record. Exceptions apply. A record can normally be requested within three months.", "next": "Ask for the search reference, date, location and how to obtain a copy. Seek help if any required explanation was omitted.", "basis": "PACE ss.2–3; Code A", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023"}, {"name": "Search", "url": "https://www.gov.uk/police-powers-to-stop-and-search-your-rights"}], "page": 7}, {"id": 9, "title": "Clothing and privacy", "cat": "Stop and search", "situation": "During a search, an officer says a more intrusive clothing search is needed.", "say": "“Please explain the reason and arrange the required privacy and safeguards.”", "law": "In public, an ordinary PACE search normally cannot require removal of clothing beyond an outer coat, jacket or gloves. More intrusive searches require privacy and safeguards; special appropriate-adult rules apply to children.", "next": "Tell the officer your age and ask for privacy and an appropriate adult if a more intrusive search is proposed. Speak to a trusted adult and solicitor about concerns.", "basis": "PACE s.2; Code A; Code C Annex A", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "Search", "url": "https://www.gov.uk/police-powers-to-stop-and-search-your-rights"}, {"name": "AA", "url": "https://www.gov.uk/government/publications/guidance-for-appropriate-adults/being-an-appropriate-adult"}], "page": 8}, {"id": 10, "title": "Handcuffs during a search", "cat": "Stop and search", "situation": "An officer puts handcuffs on you during a search, and they hurt.", "say": "“The cuffs are hurting me. Could you check them and explain why they are needed?”", "law": "Force must have a lawful basis and be necessary and proportionate. Handcuffs should be justified by the circumstances rather than applied automatically.", "next": "Keep hands visible, explain any pain or medical needs, and ask for medical help if needed. Document concerns afterwards with an adult.", "basis": "PACE s.117; Code A; HRA Arts. 3, 5", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Force", "url": "https://www.college.police.uk/app/stop-and-search/legal/legal-application"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "page": 8}, {"id": 11, "title": "Recording police in a public place", "cat": "Photography, recording and phones", "situation": "You are recording a public event and an officer asks why you are filming.", "say": "“Is there a safety restriction or legal direction I need to know about?”", "law": "Public photography and recording are generally lawful, including recording police. Expression is not absolute: obstruction, privacy, court restrictions, safety and specific statutory powers may be relevant.", "next": "Keep a safe distance from police operations. If challenged, ask what legal restriction applies; follow safety directions and resolve disputes afterwards.", "basis": "HRA Art. 10; College of Policing media guidance", "refs": [{"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Media", "url": "https://www.college.police.uk/app/media-and-communications/police-and-media"}], "page": 9}, {"id": 12, "title": "Photography near a police building", "cat": "Photography, recording and phones", "situation": "You take a photo from a public pavement near a police station and an officer approaches.", "say": "“Could you explain your concern and whether I am being detained?”", "law": "Taking photos from a public place is generally lawful. Photography alone does not automatically establish reasonable suspicion of terrorism; actual facts and context matter. Section 43 requires reasonable suspicion that the person is a terrorist.", "next": "Do not enter restricted property or interfere with operations. If approached, remain calm, explain accurately if you choose, and seek adult or legal support if detained.", "basis": "TACT s.43; TACT search code; HRA Art. 10", "refs": [{"name": "Section 43", "url": "https://www.legislation.gov.uk/ukpga/2000/11/section/43"}, {"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "TACT code", "url": "https://www.gov.uk/government/publications/police-stop-and-search-powers-code-of-practice"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "page": 9}, {"id": 13, "title": "Asked to stop recording", "cat": "Photography, recording and phones", "situation": "You are recording from a safe public position and an officer asks you to stop.", "say": "“Is that a request or a legal requirement? What is the reason?”", "law": "There is no general police power simply to ban public filming. A lawful instruction or seizure may arise from a separate power and the facts. Privacy and victim safeguarding also matter.", "next": "Prioritise safety; ask for the reason and power. Do not obstruct or physically contest an officer’s actions. Record your recollection later.", "basis": "HRA Arts. 8, 10; PACE ss.19–22 where applicable", "refs": [{"name": "Media", "url": "https://www.college.police.uk/app/media-and-communications/police-and-media"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}], "page": 10}, {"id": 14, "title": "Police take a camera or phone", "cat": "Photography, recording and phones", "situation": "Police say your phone may contain evidence of an incident and take it.", "say": "“Could I have the legal basis for seizure and the property reference?”", "law": "A device may be seized under a valid power when the relevant conditions are met, for example as evidence. Seizure, searching contents and retaining the device are distinct legal questions.", "next": "Ask for the seizure basis, property reference and how to contact the investigating officer. Do not delete, alter or interfere with evidence.", "basis": "PACE ss.19–22, 32, 54; Code B; TACT s.43", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}], "page": 10}, {"id": 15, "title": "Asked to unlock a device", "cat": "Photography, recording and phones", "situation": "An officer asks you to unlock your phone.", "say": "“Is this a voluntary request or a formal legal requirement? May I speak to a solicitor?”", "law": "An informal request is not the same as a binding disclosure notice. A properly authorised section 49 notice can impose a legal duty; non-compliance may be a criminal offence. Other statutory regimes can impose different duties.", "next": "Ask whether the request is voluntary or legally compulsory. Request legal advice and an appropriate adult where relevant. Do not ignore a formal notice.", "basis": "RIPA ss.49, 53; PACE; specialist powers", "refs": [{"name": "Section 49", "url": "https://www.legislation.gov.uk/ukpga/2000/23/section/49"}, {"name": "Section 53", "url": "https://www.legislation.gov.uk/ukpga/2000/23/section/53"}, {"name": "RIPA", "url": "https://www.legislation.gov.uk/ukpga/2000/23"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}], "page": 11}, {"id": 16, "title": "Victim or witness asked for phone data", "cat": "Photography, recording and phones", "situation": "After reporting a crime, you are asked to provide messages from your phone.", "say": "“What information do you need, why, and when will I get my phone back?”", "law": "The voluntary device extraction framework includes conditions on agreement, necessity and proportionality, with particular safeguards for children and people without capacity. Different compulsory powers can apply in other situations.", "next": "Ask what information is sought, why, the expected return date and safeguarding arrangements. Involve a trusted adult if under 18.", "basis": "PCSC Act 2022 ss.37–44; HRA Art. 8", "refs": [{"name": "PCSC", "url": "https://www.legislation.gov.uk/ukpga/2022/32"}, {"name": "Digital", "url": "https://www.cps.gov.uk/prosecution-guidance/disclosure-manual-chapter-30-digital-material"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "page": 11}, {"id": 17, "title": "Section 43 terrorism search", "cat": "Terrorism and national security", "situation": "An officer tells you that a search is being conducted under section 43 of the Terrorism Act.", "say": "“Could you explain the grounds, purpose and how I can obtain the search record?”", "law": "Section 43 allows a constable to stop and search someone reasonably suspected of being a terrorist, for evidence of that status. It is not a general power to stop anyone taking photographs.", "next": "Ask for the legal basis and record. Cooperate safely, do not interfere with the search, and ask to contact a trusted adult or solicitor if detained.", "basis": "Terrorism Act 2000 s.43; statutory code", "refs": [{"name": "Section 43", "url": "https://www.legislation.gov.uk/ukpga/2000/11/section/43"}, {"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "TACT code", "url": "https://www.gov.uk/government/publications/police-stop-and-search-powers-code-of-practice"}], "page": 12}, {"id": 18, "title": "Other terrorism searches", "cat": "Terrorism and national security", "situation": "You are stopped under a different terrorism search provision rather than section 43.", "say": "“Which section applies to this encounter, and what are my rights and duties?”", "law": "Section 43A covers vehicle searches on reasonable suspicion of terrorism use. Section 43C concerns qualifying released terrorist offenders with search conditions. Section 47A requires a valid area authorisation and does not require individual suspicion.", "next": "Ask which specific power is being exercised. Do not assume all terrorism searches require the same suspicion test. Seek specialist legal advice afterwards.", "basis": "TACT ss.43A, 43C, 47A; Sch. 6B", "refs": [{"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "TACT code", "url": "https://www.gov.uk/government/publications/police-stop-and-search-powers-code-of-practice"}], "page": 12}, {"id": 19, "title": "Terrorism arrest or security detention", "cat": "Terrorism and national security", "situation": "Police say you are being arrested under specialist terrorism or national security legislation.", "say": "“I would like legal advice and an explanation of my rights.”", "law": "Specialist detention regimes have their own grounds, time limits, review processes and legal-advice safeguards. Ordinary PACE detention deadlines cannot simply be transferred to them.", "next": "Ask for a solicitor experienced in the relevant regime and tell officers if you are under 18 or vulnerable. Ask for an appropriate adult where applicable.", "basis": "TACT s.41 and Sch. 8; NSA s.27 and Sch. 6; Codes H/I", "refs": [{"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "NSA", "url": "https://www.legislation.gov.uk/ukpga/2023/32"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 13}, {"id": 20, "title": "Border and port examination", "cat": "Terrorism and national security", "situation": "At a port, an officer says you are being examined under a special statutory power.", "say": "“Please explain the power, my duties and how to obtain legal advice.”", "law": "Special border examination powers differ from ordinary street stops and can apply without individual suspicion. They include duties to cooperate and specific safeguards, which depend on the power.", "next": "Ask for an explanation of your rights and duties and for legal advice. Follow lawful requirements; do not rely on general street-stop rules.", "basis": "TACT Sch. 7; CTBS Act 2019 Sch. 3", "refs": [{"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "CTBS", "url": "https://www.legislation.gov.uk/ukpga/2019/3"}], "page": 13}, {"id": 21, "title": "Told to leave an area", "cat": "Public order and public spaces", "situation": "Police direct you to leave a town centre for a specified period after disorder.", "say": "“Could you explain the area, duration and reason for the direction?”", "law": "A dispersal direction must meet statutory conditions, including relevant authorisation. Since 26 October 2026, the maximum exclusion period is 72 hours; directions over 48 hours require inspector review after 48 hours. Restrictions and exceptions apply.", "next": "Ask for the direction, area, duration and reason in writing where practicable. Follow lawful directions and seek advice if you disagree.", "basis": "Anti-social Behaviour, Crime and Policing Act 2014 ss.34-39; Crime and Policing Act 2026 s.3; SI 2026/960 reg.4 (check current text)", "refs": [{"name": "Section 35", "url": "https://www.legislation.gov.uk/ukpga/2014/12/section/35"}, {"name": "2026 amendment", "url": "https://www.legislation.gov.uk/ukpga/2026/20/section/3"}, {"name": "ASB", "url": "https://www.legislation.gov.uk/ukpga/2014/12"}, {"name": "2026", "url": "https://www.legislation.gov.uk/ukpga/2026/20"}], "page": 14}, {"id": 22, "title": "Alleged threatening or abusive behaviour", "cat": "Public order and public spaces", "situation": "An officer says that your words or behaviour may constitute a public order offence.", "say": "“Could you explain the alleged offence? I would like legal advice if interviewed.”", "law": "The offences have different elements, including the words or conduct, context and relevant impact or intent. Merely disagreeing with an officer is not automatically an offence.", "next": "Avoid insults, threats and escalation. Ask for legal advice if accused or interviewed.", "basis": "Public Order Act 1986 ss.4, 4A, 5", "refs": [{"name": "POA", "url": "https://www.legislation.gov.uk/ukpga/1986/64"}], "page": 14}, {"id": 23, "title": "Protest or demonstration", "cat": "Public order and public spaces", "situation": "You attend a peaceful demonstration with a trusted adult and police announce conditions.", "say": "“What are the conditions, and where is it safe to stand?”", "law": "Peaceful assembly and expression are protected, but lawful restrictions can apply. Procession and assembly conditions, specific protest offences and later amendments must be checked for the event and date.", "next": "If attending a lawful event, stay with a trusted adult, keep away from confrontations and comply with safety instructions and lawful conditions.", "basis": "POA ss.12–14; HRA Arts. 10–11; PO23; 2026 Act", "refs": [{"name": "POA", "url": "https://www.legislation.gov.uk/ukpga/1986/64"}, {"name": "PO23", "url": "https://www.legislation.gov.uk/ukpga/2023/15"}, {"name": "2026", "url": "https://www.legislation.gov.uk/ukpga/2026/20"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "CPS protest", "url": "https://www.cps.gov.uk/prosecution-guidance/protests-potential-offences-during-protests-demonstrations-or-campaigns-annex"}], "page": 15}, {"id": 24, "title": "Cordons and restricted access", "cat": "Public order and public spaces", "situation": "You arrive at a street blocked by police tape.", "say": "“Where is it safe to go, and is there an alternative route?”", "law": "A cordon may have a specific statutory basis, or be part of incident management. Public access and recording rights do not grant a right to cross a lawful cordon.", "next": "Stay outside cordons and away from hazards. Ask an officer or steward where it is safe to stand.", "basis": "TACT ss.33–36; common-law and other statutory powers", "refs": [{"name": "TACT", "url": "https://www.legislation.gov.uk/ukpga/2000/11"}, {"name": "Media", "url": "https://www.college.police.uk/app/media-and-communications/police-and-media"}], "page": 15}, {"id": 25, "title": "Private property and shopping centres", "cat": "Public order and public spaces", "situation": "A shopping centre manager asks you to leave private premises.", "say": "“I will leave safely. Could you explain the reason?”", "law": "Access to private property may be conditional or withdrawn. Ordinary trespass is usually a civil matter, but aggravated trespass and other statutory offences can be criminal.", "next": "Leave when the lawful occupier withdraws permission. Dispute the matter later through appropriate channels rather than escalating.", "basis": "Common-law trespass; CJPOA ss.68–69", "refs": [{"name": "CJPOA", "url": "https://www.legislation.gov.uk/ukpga/1994/33"}], "page": 16}, {"id": 26, "title": "A PCSO gives a direction", "cat": "Public order and public spaces", "situation": "A PCSO asks you to follow a direction in a town centre.", "say": "“Could you explain what power applies and what I need to do?”", "law": "PCSOs are not identical to constables. Their powers depend on statutory rules and designation, and may include specified requirements or directions.", "next": "Ask which power applies and whether the direction is compulsory. Do not assume every PCSO has identical powers.", "basis": "Police Reform Act 2002 ss.38–42 and schedules", "refs": [{"name": "PRA", "url": "https://www.legislation.gov.uk/ukpga/2002/30"}], "page": 16}, {"id": 27, "title": "Police knock at your door", "cat": "Home, entry and property", "situation": "Police knock on your front door and ask to come inside.", "say": "“Could you identify yourselves and explain why you need to come in?”", "law": "Police may ask for permission to enter, but consent is not the only legal basis. A warrant, statutory power or other lawful authority may permit entry without consent.", "next": "If you are under 18, get a parent or trusted adult if safe. Ask officers to identify themselves and explain the reason for entry. Never physically block entry.", "basis": "PACE ss.8, 17; Code B; HRA Art. 8", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "page": 17}, {"id": 28, "title": "Search warrant presented", "cat": "Home, entry and property", "situation": "Officers arrive with a warrant to search the house.", "say": "“May I see the warrant and have a copy, please?”", "law": "A warrant authorises a search within its terms and statutory limits. Occupiers are normally entitled to specified information and a copy in accordance with the applicable procedure.", "next": "Ask to see the warrant and request a copy. Tell officers about safety, medical needs or vulnerable occupants. Seek legal advice on any dispute.", "basis": "PACE ss.8, 15–16; Code B", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 17}, {"id": 29, "title": "Entry without a warrant", "cat": "Home, entry and property", "situation": "Police enter a home because they believe somebody inside needs emergency help.", "say": "“Is anyone in danger? What is the reason for entry?”", "law": "Section 17 allows entry in specified situations, including certain arrests and saving life or limb or preventing serious property damage. The legal threshold depends on the specific purpose.", "next": "Ask why entry is required. Do not obstruct officers responding to an emergency or exercising lawful powers.", "basis": "PACE s.17; common law", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}], "page": 18}, {"id": 30, "title": "Search after an arrest", "cat": "Home, entry and property", "situation": "After an arrest, officers say they need to search a room connected with the investigation.", "say": "“Which search power is being used, and can I have a record of anything taken?”", "law": "Section 18 concerns premises occupied or controlled by a person arrested for an indictable offence; section 32 may apply to places where that person was when arrested or immediately before arrest. Each has its own conditions and limits.", "next": "Ask for the search basis and property list. Let a solicitor review whether the scope and authorisation were proper.", "basis": "PACE ss.18, 32; Code B", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 18}, {"id": 31, "title": "Stolen goods traced electronically", "cat": "Home, entry and property", "situation": "A device tracker appears to show stolen property inside a building.", "say": "“Could you explain the current legal authority for the search?”", "law": "The 2026 Act contains a new warrantless search scheme for electronically tracked stolen goods. It was not in force at Royal Assent; commencement has not been confirmed for this guide. Do not assume tracking alone grants entry. Existing warrant and other entry powers may apply.", "next": "If officers rely on this power, ask for the reason, authorisation details and seizure record. Do not confront someone suspected of theft yourself.", "basis": "Crime and Policing Act 2026 s.171; proposed Theft Act 1968 ss.26A-26C (commencement unconfirmed)", "refs": [{"name": "Section 171", "url": "https://www.legislation.gov.uk/ukpga/2026/20/section/171"}, {"name": "2026", "url": "https://www.legislation.gov.uk/ukpga/2026/20"}, {"name": "Theft", "url": "https://www.legislation.gov.uk/ukpga/1968/60"}], "page": 19}, {"id": 32, "title": "Police keep seized property", "cat": "Home, entry and property", "situation": "Your laptop is still held by police weeks after it was seized.", "say": "“Could you review whether it still needs to be retained and tell me how to request its return?”", "law": "Property may be kept for as long as necessary under the relevant power, for example for evidential purposes. Access or copies may be available subject to statutory restrictions.", "next": "Ask for the property reference, review of continuing retention, and a return date or explanation. A solicitor can advise on a formal challenge.", "basis": "PACE ss.21–22; Code B", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 19}, {"id": 33, "title": "Police stop a vehicle", "cat": "Roads and transport", "situation": "A uniformed officer signals a car you are travelling in to stop.", "say": "“Is there anything you need me to do as a passenger?”", "law": "A uniformed constable can require a motor vehicle driver or cyclist on a road to stop under this power without first suspecting a specific offence.", "next": "If a passenger, stay calm and follow safety directions. Drivers must stop safely when legally required.", "basis": "RTA s.163", "refs": [{"name": "RTA", "url": "https://www.legislation.gov.uk/ukpga/1988/52"}, {"name": "Driving", "url": "https://www.gov.uk/stopped-by-police-while-driving-your-rights"}], "page": 20}, {"id": 34, "title": "Driving documents requested", "cat": "Roads and transport", "situation": "A driver is asked to produce their driving licence and insurance documents.", "say": "“What documents are required, and how should they be provided?”", "law": "Police can require relevant driving, insurance and related details or documents in specified circumstances. GOV.UK explains the usual seven-day production arrangements where documents are not available.", "next": "Provide truthful required details. If documents must be produced later, follow the instructions and keep the reference.", "basis": "RTA ss.164–165", "refs": [{"name": "RTA", "url": "https://www.legislation.gov.uk/ukpga/1988/52"}, {"name": "Driving", "url": "https://www.gov.uk/stopped-by-police-while-driving-your-rights"}], "page": 20}, {"id": 35, "title": "Roadside testing", "cat": "Roads and transport", "situation": "A driver is told a roadside test is required after a traffic incident.", "say": "“Could you explain the requirement? I need to mention a medical issue if relevant.”", "law": "Roadside and evidential testing powers have defined statutory conditions; failure to cooperate or provide a specimen without reasonable excuse can be an offence.", "next": "Follow lawful requirements and tell officers about genuine medical difficulties. Seek a solicitor if arrested.", "basis": "RTA ss.6–7", "refs": [{"name": "RTA", "url": "https://www.legislation.gov.uk/ukpga/1988/52"}, {"name": "Driving", "url": "https://www.gov.uk/stopped-by-police-while-driving-your-rights"}], "page": 21}, {"id": 36, "title": "Vehicle search or seizure", "cat": "Roads and transport", "situation": "Police tell a driver that the vehicle is to be seized because of a licensing or insurance issue.", "say": "“Could you explain the power and provide the seizure paperwork?”", "law": "A routine road stop is not itself a general power to search. Other powers can allow a search or seizure when their separate conditions are met, including specified insurance, licensing or anti-social use circumstances.", "next": "Ask which legal power applies and request the record or seizure notice. Do not obstruct removal.", "basis": "PACE ss.1–3; RTA s.165A; PRA s.59", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "RTA", "url": "https://www.legislation.gov.uk/ukpga/1988/52"}, {"name": "PRA", "url": "https://www.legislation.gov.uk/ukpga/2002/30"}], "page": 21}, {"id": 37, "title": "Arrest or threat of arrest", "cat": "Arrest and custody", "situation": "An officer says you are under arrest following an allegation of theft.", "say": "“What am I being arrested for? I would like a solicitor.”", "law": "Ordinary constable arrest requires statutory grounds and reasonable grounds to believe arrest is necessary. A person must be informed of arrest and its grounds as soon as practicable.", "next": "Ask why you are being arrested. Do not resist. Ask for a free solicitor and tell officers if you are under 18.", "basis": "PACE ss.24, 28; Code G", "refs": [{"name": "Section 24", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/24"}, {"name": "Section 28", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/28"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "Arrest", "url": "https://www.gov.uk/arrested-your-rights"}], "page": 22}, {"id": 38, "title": "Search on arrest", "cat": "Arrest and custody", "situation": "At arrest or arrival in custody, police ask to search you and take property.", "say": "“Please record my belongings and any medical needs.”", "law": "Search on arrest and custody searches have distinct purposes and conditions, including safety, evidence and property management. Their scope is not unlimited.", "next": "Explain any medical or disability needs and ask for a property record. Raise concerns with the custody officer or solicitor.", "basis": "PACE ss.32, 54", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 22}, {"id": 39, "title": "Rights at the police station", "cat": "Arrest and custody", "situation": "You arrive at a police station following arrest and do not know your rights.", "say": "“I would like a free solicitor and someone informed of my whereabouts.”", "law": "Ordinary custody rights include legal advice, notifying someone, consulting the applicable codes, appropriate medical care and information about the allegation. Limited statutory exceptions can affect timing.", "next": "Ask for a duty solicitor, a trusted adult to be informed and the written notice of rights. Request an interpreter if needed.", "basis": "PACE ss.56, 58; Code C", "refs": [{"name": "Section 58", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/58"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Arrest", "url": "https://www.gov.uk/arrested-your-rights"}, {"name": "Custody", "url": "https://www.gov.uk/government/publications/notice-of-rights-and-entitlements-english/notice-of-rights-and-entitlements-english"}], "page": 23}, {"id": 40, "title": "Under 18 in custody", "cat": "Arrest and custody", "situation": "A person aged 16 is taken to a police station for questioning.", "say": "“I am under 18. I would like an appropriate adult and a solicitor.”", "law": "Children require an appropriate adult to safeguard welfare and rights. The adult is not a substitute for an independent solicitor. Special rules apply to interviews, detention and searches.", "next": "State your age and ask for both an appropriate adult and free legal advice. Tell the custody officer if you feel unsafe or unwell.", "basis": "PACE Code C; appropriate adult guidance", "refs": [{"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "AA", "url": "https://www.gov.uk/government/publications/guidance-for-appropriate-adults/being-an-appropriate-adult"}, {"name": "Arrest", "url": "https://www.gov.uk/arrested-your-rights"}], "page": 23}, {"id": 41, "title": "How long can police hold someone?", "cat": "Arrest and custody", "situation": "You have been in custody for several hours and want to know when the detention will be reviewed.", "say": "“When is my next detention review? Can my solicitor check the time limit?”", "law": "For ordinary pre-charge detention, the usual limit is 24 hours from the relevant time. For qualifying indictable offences, a superintendent may authorise up to 36 hours and a court may authorise further detention up to 96 hours total. Other regimes differ.", "next": "Ask the custody officer for the relevant time, reasons and next review. Ask your solicitor to check any extension.", "basis": "Police and Criminal Evidence Act 1984 ss.40-44; PACE Code C", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Arrest", "url": "https://www.gov.uk/arrested-your-rights"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 24}, {"id": 42, "title": "Interview under caution", "cat": "Arrest and custody", "situation": "An officer begins a recorded suspect interview under caution.", "say": "“I would like to speak to my solicitor before deciding how to answer.”", "law": "A suspect has access to legal advice. Silence can have legal consequences in defined circumstances, including possible adverse inferences. Interviews are regulated and normally recorded in accordance with applicable codes.", "next": "Ask to speak privately with your solicitor before deciding how to answer. If under 18, request an appropriate adult. Do not rely on a universal interview script.", "basis": "PACE Code C; CJPOA ss.34–37; Codes E/F", "refs": [{"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "CJPOA", "url": "https://www.legislation.gov.uk/ukpga/1994/33"}, {"name": "Custody", "url": "https://www.gov.uk/government/publications/notice-of-rights-and-entitlements-english/notice-of-rights-and-entitlements-english"}], "page": 24}, {"id": 43, "title": "Voluntary interview", "cat": "Arrest and custody", "situation": "Police invite you to a voluntary suspect interview next week.", "say": "“Can I arrange this with a solicitor and have the written notice of my rights?”", "law": "A voluntary suspect interview is not the same as arrest. Free independent legal advice is available; the person can ordinarily leave unless arrested. Appropriate-adult safeguards apply to children.", "next": "Arrange attendance with a solicitor and trusted adult. Ask for the allegation, interview arrangements and written rights notice.", "basis": "PACE Code C; Home Office voluntary rights notice", "refs": [{"name": "Voluntary", "url": "https://www.gov.uk/government/publications/voluntary-police-interview-your-rights/remember-your-rights-voluntary-interview-accessible-version"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "AA", "url": "https://www.gov.uk/government/publications/guidance-for-appropriate-adults/being-an-appropriate-adult"}], "page": 25}, {"id": 44, "title": "Fingerprints, photographs and DNA", "cat": "Arrest and custody", "situation": "At the police station you are told fingerprints or a photograph will be taken.", "say": "“What is the legal basis, and how can I find out the retention rules?”", "law": "Statutory powers permit collection and retention of identification material in defined circumstances, sometimes without consent. Retention and deletion depend on the material and case outcome.", "next": "Ask what is being collected and why. Ask your solicitor to explain the applicable retention and deletion rules.", "basis": "PACE ss.61–64, 64A; Code D", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 25}, {"id": 45, "title": "Released on bail or under investigation", "cat": "Arrest and custody", "situation": "Police release you while they continue investigating and give you paperwork.", "say": "“Am I on bail or released under investigation? What conditions or dates apply?”", "law": "Pre-charge bail may have conditions and a return date; release under investigation is normally without bail conditions. Neither necessarily means the case has ended.", "next": "Keep all paperwork, comply with bail conditions and consult your solicitor about changes or updates.", "basis": "PACE ss.34–50B; PCSC 2022 reforms", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "PCSC", "url": "https://www.legislation.gov.uk/ukpga/2022/32"}, {"name": "Bail", "url": "https://www.gov.uk/government/publications/pre-charge-bail-statutory-guidance/pre-charge-bail-statutory-guidance-accessible"}], "page": 26}, {"id": 46, "title": "Charged, cautioned or no further action", "cat": "Arrest and custody", "situation": "Police offer a formal caution instead of charging a suspect.", "say": "“Could my solicitor explain the consequences before I make a decision?”", "law": "Charge, a youth caution or other disposal, and no further action have different consequences. A caution is not simply an informal warning; eligibility, admission and safeguards matter.", "next": "Obtain advice before accepting any disposal or signing documents. If a child, involve an appropriate adult and solicitor.", "basis": "PACE s.37; Crime and Disorder Act 1998 s.66ZA (youth cautions); PACE Code C", "refs": [{"name": "Youth caution s.66ZA", "url": "https://www.legislation.gov.uk/ukpga/1998/37/section/66ZA"}, {"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}, {"name": "Arrest", "url": "https://www.gov.uk/arrested-your-rights"}], "page": 26}, {"id": 47, "title": "Use of force by police", "cat": "Safety, care and accountability", "situation": "During restraint you feel pain or have trouble breathing comfortably.", "say": "“I am having difficulty breathing. I need medical help.”", "law": "Force requires a lawful basis; its necessity and proportionality must be assessed against the situation. This includes restraint and other uses of force.", "next": "Do not physically resist. Tell officers if you cannot breathe comfortably, are in pain or need medical care. Seek urgent care where necessary and document concerns with an adult.", "basis": "PACE s.117; Criminal Law Act 1967 s.3; HRA Arts. 2–3", "refs": [{"name": "PACE", "url": "https://www.legislation.gov.uk/ukpga/1984/60"}, {"name": "CLA", "url": "https://www.legislation.gov.uk/ukpga/1967/58"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Force", "url": "https://www.college.police.uk/app/stop-and-search/legal/legal-application"}], "page": 27}, {"id": 48, "title": "Police protection of a child", "cat": "Safety, care and accountability", "situation": "Police say a child needs to be taken somewhere safe because of a serious welfare concern.", "say": "“Where am I going, and who will be supporting me?”", "law": "Where police reasonably believe a child would otherwise be likely to suffer significant harm, they may take protective action under s.46. Police protection is not a criminal arrest and cannot last more than 72 hours.", "next": "Ask where you are being taken and who will support you. Tell a trusted adult or social worker what you need to feel safe.", "basis": "Children Act 1989 s.46", "refs": [{"name": "Children", "url": "https://www.legislation.gov.uk/ukpga/1989/41"}], "page": 27}, {"id": 49, "title": "Mental health place of safety", "cat": "Safety, care and accountability", "situation": "Police say they are taking someone to a place of safety for a mental health assessment.", "say": "“Can I speak to a health professional and have a trusted person informed?”", "law": "These are assessment and protection powers, not ordinary criminal arrest powers. Section 135 involves a warrant; s.136 has location and other safeguards. A police station cannot be used as a place of safety for a child under these powers.", "next": "Ask for health professionals and a trusted adult. Share immediate medical needs; seek help promptly if worried about your safety.", "basis": "Mental Health Act 1983 ss.135–136A", "refs": [{"name": "MHA", "url": "https://www.legislation.gov.uk/ukpga/1983/20"}], "page": 28}, {"id": 50, "title": "Disability, language and discrimination", "cat": "Safety, care and accountability", "situation": "A person cannot follow the questions because of a disability or language barrier.", "say": "“I need an interpreter or communication support. Please record that need.”", "law": "Police must consider applicable equality duties and individual needs. Custody procedures provide interpretation and support for people who need them; reasonable adjustments may be necessary.", "next": "Explain communication needs, disability or medication. Request an interpreter or suitable support, and ask for your needs to be recorded.", "basis": "Equality Act 2010; HRA Arts. 5, 14; Code C", "refs": [{"name": "Equality", "url": "https://www.legislation.gov.uk/ukpga/2010/15"}, {"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "page": 28}, {"id": 51, "title": "Reporting a crime or being a witness", "cat": "Safety, care and accountability", "situation": "You witness an incident and police ask you for an account.", "say": "“Can you explain how to give my account safely and what support is available?”", "law": "Victims have entitlements to information and support under the applicable Victims’ Code. Witnesses may be asked for statements or evidence; formal duties depend on the circumstances.", "next": "Report immediate danger via 999; use 101 or online reporting for non-emergencies. Ask a trusted adult to help and preserve evidence safely.", "basis": "Domestic Violence, Crime and Victims Act 2004 s.32; Victims’ Code; PCSC Act 2022 ss.37-44", "refs": [{"name": "Victims", "url": "https://www.gov.uk/government/publications/the-code-of-practice-for-victims-of-crime"}, {"name": "PCSC", "url": "https://www.legislation.gov.uk/ukpga/2022/32"}], "page": 29}, {"id": 52, "title": "Complaint about conduct", "cat": "Safety, care and accountability", "situation": "You believe an officer treated you unfairly during a stop.", "say": "“I would like to make a formal complaint and request preservation of relevant records.”", "law": "Complaints may concern conduct or service. The relevant force handles most complaints, and the IOPC oversees the system and investigates certain serious matters.", "next": "Write a factual account, include reference numbers and ask for evidence preservation. If under 18, ask a trusted adult to assist.", "basis": "Police Reform Act 2002 Sch. 3; IOPC guidance", "refs": [{"name": "PRA", "url": "https://www.legislation.gov.uk/ukpga/2002/30"}, {"name": "IOPC", "url": "https://www.policeconduct.gov.uk/complaints/guide-to-complaints-process"}], "page": 29}, {"id": 53, "title": "Obtaining body-worn video or records", "cat": "Safety, care and accountability", "situation": "You want footage of your own encounter from police body-worn cameras.", "say": "“How do I request my personal data and ask that relevant footage be preserved?”", "law": "A subject access request concerns your personal data, not an automatic right to all recordings or investigation material. Restrictions, third-party privacy and redaction may apply. The usual response period is one calendar month, subject to applicable rules.", "next": "Request relevant personal data promptly and separately ask that footage be preserved. Include enough details to locate it securely.", "basis": "DPA 2018 Part 3 ss.45–54; UK GDPR where applicable", "refs": [{"name": "DPA", "url": "https://www.legislation.gov.uk/ukpga/2018/12"}, {"name": "ICO", "url": "https://ico.org.uk/for-the-public/crime/"}], "page": 30}, {"id": 54, "title": "Challenging a decision or seeking compensation", "cat": "Safety, care and accountability", "situation": "You receive a complaint decision and disagree with the outcome.", "say": "“Who can review this decision, and what is the deadline?”", "law": "A complaint is distinct from civil litigation, judicial review and a criminal defence. Time limits differ and can be short. A complaint does not necessarily stop legal deadlines running.", "next": "Seek qualified legal advice promptly. For a complaint outcome, check the named review body and the 28-day review deadline.", "basis": "HRA s.7; Limitation Act 1980; complaints review framework", "refs": [{"name": "HRA", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Limitation", "url": "https://www.legislation.gov.uk/ukpga/1980/58"}, {"name": "Review", "url": "https://www.policeconduct.gov.uk/complaints/reviews-and-appeals"}], "page": 30}, {"id": 55, "title": "Officer asks where you have been", "cat": "Street encounters", "situation": "You are leaving a shop and an officer asks about your journey.", "say": "Is this a voluntary conversation?", "law": "Questions alone do not create a power of detention. Other statutory duties may apply.", "next": "Stay calm and ask for clarification; follow lawful directions.", "basis": "PACE Code A; HRA Article 5", "refs": [{"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}, {"name": "Human rights", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "parent": 1, "page": null}, {"id": 56, "title": "Asked for ID while with friends", "cat": "Street encounters", "situation": "Police ask the group for names after a report nearby.", "say": "Could you explain whether there is a legal requirement for my details?", "law": "There is no blanket street ID duty. Particular powers, including section 50, may require details.", "next": "Provide accurate details if required and ask a trusted adult for support.", "basis": "Police Reform Act 2002 s.50", "refs": [{"name": "Section 50", "url": "https://www.legislation.gov.uk/ukpga/2002/30/section/50"}], "parent": 2, "page": null}, {"id": 57, "title": "Officer says a neighbour complained", "cat": "Street encounters", "situation": "A neighbour reports a noisy gathering and police request your address.", "say": "Could you explain the alleged conduct and the power you are using?", "law": "Section 50 requires reason to believe the person engaged in anti-social behaviour; a complaint may be relevant but context matters.", "next": "Do not give false details. Discuss disputes with a trusted adult afterwards.", "basis": "Police Reform Act 2002 s.50; current amended text", "refs": [{"name": "Section 50", "url": "https://www.legislation.gov.uk/ukpga/2002/30/section/50"}], "parent": 3, "page": null}, {"id": 58, "title": "Unsure whether someone is an officer", "cat": "Street encounters", "situation": "A person not in uniform claims to be an officer.", "say": "May I see your police identification?", "law": "Documentary identification is required for a plain-clothes officer using PACE search powers.", "next": "If unsure, seek help from a trusted adult or verify via 101; call 999 in immediate danger.", "basis": "PACE s.2; Code A", "refs": [{"name": "Section 2", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/2"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 4, "page": null}, {"id": 59, "title": "Search based only on clothing", "cat": "Stop and search", "situation": "An officer refers only to the type of coat you are wearing.", "say": "What specific information supports the search?", "law": "An ordinary suspicion-based search requires objective grounds; appearance alone is not generally enough, though a specific suspect description may be relevant.", "next": "Do not physically resist. Ask for the record and obtain advice later.", "basis": "PACE s.1; Code A para. 2.2", "refs": [{"name": "Section 1", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/1"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 5, "page": null}, {"id": 60, "title": "Search after a shop alarm", "cat": "Stop and search", "situation": "An alarm sounds as you leave a shop and an officer wants to check your bag.", "say": "What are you looking for and what are the grounds?", "law": "A suspicion-based search must relate to an item the statutory power allows police to seek. Whether the alarm supplies grounds depends on the facts.", "next": "Cooperate safely and ask for a record.", "basis": "PACE ss.1–3; Code A", "refs": [{"name": "Section 1", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/1"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 5, "page": null}, {"id": 61, "title": "Search finds nothing", "cat": "Stop and search", "situation": "Your belongings are checked and no item is found.", "say": "May I have the search record? Am I free to go?", "law": "An unsuccessful search is not necessarily unlawful; the grounds are assessed at the time. Continued detention needs a legal basis.", "next": "Ask for the record, then leave when told you can.", "basis": "PACE ss.2–3; Code A", "refs": [{"name": "Section 3", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/3"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 5, "page": null}, {"id": 62, "title": "Search record not available at scene", "cat": "Stop and search", "situation": "The officer says the electronic record cannot be printed.", "say": "How can I obtain a copy of the search record?", "law": "Code A sets recording and access requirements. The usual entitlement to a copy of a PACE search record lasts three months.", "next": "Keep the reference and ask the force for the record.", "basis": "PACE s.3; Code A para. 4", "refs": [{"name": "Section 3", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/3"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 8, "page": null}, {"id": 63, "title": "Officer has not explained the search", "cat": "Stop and search", "situation": "Police begin an ordinary street search before explaining the reason.", "say": "Could you tell me the grounds and legal power, please?", "law": "PACE and Code A normally require key information before a search, subject to applicable exceptions.", "next": "Avoid physical resistance and document concerns afterwards.", "basis": "PACE s.2; Code A para. 3.8", "refs": [{"name": "Section 2", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/2"}, {"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}], "parent": 8, "page": null}, {"id": 64, "title": "More private search requested", "cat": "Stop and search", "situation": "Police say an ordinary outer-clothing search is insufficient.", "say": "Could you explain the safeguards and arrange privacy?", "law": "More intrusive searches have additional safeguards concerning necessity, privacy and children.", "next": "Ask for a trusted adult and appropriate support; report any concerns afterwards.", "basis": "PACE Code A paras. 3.5–3.7; Code C Annex A", "refs": [{"name": "Code A", "url": "https://www.gov.uk/government/publications/pace-code-a-december-2023/pace-code-a-2023-accessible"}, {"name": "Code C", "url": "https://www.gov.uk/government/publications/pace-code-c-2023/pace-code-c-2023-accessible"}], "parent": 9, "page": null}, {"id": 65, "title": "Handcuffs are uncomfortable", "cat": "Stop and search", "situation": "During detention, restraints cause discomfort.", "say": "These are hurting. Could you check them, please?", "law": "Force must have a lawful basis and be reasonable in the circumstances.", "next": "Tell officers promptly about pain or medical needs; seek medical help if needed.", "basis": "PACE s.117; Criminal Law Act 1967 s.3", "refs": [{"name": "Section 117", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/117"}, {"name": "Human rights", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "parent": 10, "page": null}, {"id": 66, "title": "Recording a public incident", "cat": "Photography, recording and phones", "situation": "You are observing an incident from a public place.", "say": "Where can I safely stand without obstructing anyone?", "law": "Expression is protected but can be lawfully restricted. Recording does not override safety cordons or other lawful restrictions.", "next": "Keep clear of the incident and follow lawful instructions.", "basis": "HRA Article 10; College of Policing media guidance", "refs": [{"name": "Human rights", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Media guidance", "url": "https://www.college.police.uk/app/media-and-communications/police-and-media"}], "parent": 11, "page": null}, {"id": 67, "title": "Officer asks you to delete footage", "cat": "Photography, recording and phones", "situation": "An officer asks you to remove a recording of an encounter.", "say": "Could you explain the legal authority for that request?", "law": "There is no general power to order deletion merely because police were filmed. Specific legal powers or orders may apply in other contexts.", "next": "Do not argue or physically resist; seek legal advice if footage is lost.", "basis": "HRA Arts. 8, 10; PACE ss.19–22", "refs": [{"name": "Human rights", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}, {"name": "Seizure", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/19"}], "parent": 13, "page": null}, {"id": 68, "title": "Phone taken for evidence", "cat": "Photography, recording and phones", "situation": "An officer says a device is needed as evidence.", "say": "May I have a receipt or reference and the reason for seizure?", "law": "Seizure, retention and examination are distinct questions. PACE powers have conditions and purposes.", "next": "Do not interfere with evidence; ask for a solicitor or trusted adult.", "basis": "PACE ss.19–22", "refs": [{"name": "Seizure", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/19"}, {"name": "Access and records", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/21"}, {"name": "Retention", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/22"}], "parent": 14, "page": null}, {"id": 69, "title": "Witness offered digital extraction", "cat": "Photography, recording and phones", "situation": "Police ask a witness whether they will allow extraction of personal data.", "say": "What information is needed, why, and what are my options?", "law": "The voluntary extraction framework requires agreement and statutory safeguards; other powers are separate.", "next": "Ask a trusted adult or adviser to help you understand the written information.", "basis": "Police, Crime, Sentencing and Courts Act 2022 ss.37–44", "refs": [{"name": "Extraction powers", "url": "https://www.legislation.gov.uk/ukpga/2022/32/section/37"}], "parent": 16, "page": null}, {"id": 70, "title": "Terrorism search ends without arrest", "cat": "Terrorism and national security", "situation": "An officer finishes a terrorism search and says there is no arrest.", "say": "How can I get a record of the encounter?", "law": "Section 43 has its own statutory test and recording guidance; it is not the same as PACE s.1.", "next": "Request the reference and obtain advice if concerned.", "basis": "Terrorism Act 2000 s.43; statutory code", "refs": [{"name": "Section 43", "url": "https://www.legislation.gov.uk/ukpga/2000/11/section/43"}, {"name": "Terrorism code", "url": "https://www.gov.uk/government/publications/police-stop-and-search-powers-code-of-practice"}], "parent": 17, "page": null}, {"id": 71, "title": "Move-on direction given in writing", "cat": "Public order and public spaces", "situation": "An officer hands you a written direction to leave an area.", "say": "Could you explain the area, duration and applicable exceptions?", "law": "Dispersal powers have statutory conditions and limits; use the current amended legislation.", "next": "Follow lawful directions; seek advice if you think the direction is wrong.", "basis": "ASBCPA 2014 ss.34–39; Crime and Policing Act 2026 amendments", "refs": [{"name": "Section 35", "url": "https://www.legislation.gov.uk/ukpga/2014/12/section/35"}, {"name": "Section 36", "url": "https://www.legislation.gov.uk/ukpga/2014/12/section/36"}], "parent": 21, "page": null}, {"id": 72, "title": "Direction affects your route home", "cat": "Public order and public spaces", "situation": "A police direction covers a route you normally use to get home.", "say": "I need to get home safely. What route should I use?", "law": "Dispersal legislation includes restrictions on directions affecting specified access needs; facts matter.", "next": "Ask for a safe route and contact a trusted adult.", "basis": "ASBCPA 2014 s.36 (current text)", "refs": [{"name": "Section 36", "url": "https://www.legislation.gov.uk/ukpga/2014/12/section/36"}], "parent": 21, "page": null}, {"id": 73, "title": "Disagreement in a public place", "cat": "Public order and public spaces", "situation": "Police attend after an argument in the street.", "say": "Could you explain what conduct is being investigated?", "law": "Public order offences have separate legal elements; disagreement alone does not establish an offence.", "next": "Keep distance, avoid escalation and seek advice if interviewed.", "basis": "Public Order Act 1986 ss.4, 4A, 5", "refs": [{"name": "Public Order Act", "url": "https://www.legislation.gov.uk/ukpga/1986/64"}], "parent": 22, "page": null}, {"id": 74, "title": "Peaceful march has a condition", "cat": "Public order and public spaces", "situation": "Police tell participants that a march has a route condition.", "say": "Where can I read the condition and its boundaries?", "law": "Public order legislation permits conditions in specified circumstances; expression and assembly rights remain relevant.", "next": "Follow lawful instructions and avoid confrontation.", "basis": "Public Order Act 1986 ss.12–14; HRA Arts.10–11", "refs": [{"name": "Section 12", "url": "https://www.legislation.gov.uk/ukpga/1986/64/section/12"}, {"name": "Human rights", "url": "https://www.legislation.gov.uk/ukpga/1998/42/schedule/1"}], "parent": 23, "page": null}, {"id": 75, "title": "Road closed by a police cordon", "cat": "Public order and public spaces", "situation": "A cordon blocks the road you normally use.", "say": "Is there a safe alternative route?", "law": "Different legal bases may apply to different cordons and emergencies.", "next": "Stay outside the cordon and use a safe route.", "basis": "Terrorism Act 2000 ss.33–36 where applicable; other statutory/common-law powers", "refs": [{"name": "Section 33", "url": "https://www.legislation.gov.uk/ukpga/2000/11/section/33"}], "parent": 24, "page": null}, {"id": 76, "title": "Asked to leave a shopping centre", "cat": "Public order and public spaces", "situation": "A security guard says the premises are privately managed.", "say": "Where is the public exit, please?", "law": "Private ownership and public access are distinct. Permission to remain may be withdrawn, subject to applicable law.", "next": "Leave safely; raise any discrimination or other complaint afterwards.", "basis": "Common-law trespass; Equality Act 2010 where applicable", "refs": [{"name": "Equality Act", "url": "https://www.legislation.gov.uk/ukpga/2010/15"}], "parent": 25, "page": null}, {"id": 77, "title": "PCSO asks for your details", "cat": "Public order and public spaces", "situation": "A PCSO says they need your name after an incident.", "say": "Could you explain which power applies?", "law": "PCSOs have statutory and designated powers that differ from a constable’s powers; local designations matter.", "next": "Comply with lawful requirements and seek advice if unsure.", "basis": "Police Reform Act 2002 ss.38–42", "refs": [{"name": "Police Reform Act", "url": "https://www.legislation.gov.uk/ukpga/2002/30/section/38"}], "parent": 26, "page": null}, {"id": 78, "title": "Police ask to speak to a parent", "cat": "Home, entry and property", "situation": "Officers arrive while a parent or carer is elsewhere.", "say": "Can I contact my parent or another trusted adult?", "law": "A request to enter differs from a power of entry; emergencies and warrants have separate rules.", "next": "Seek adult support and do not physically block officers.", "basis": "PACE ss.8,17; Code B", "refs": [{"name": "Entry", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/17"}, {"name": "PACE codes", "url": "https://www.gov.uk/guidance/police-and-criminal-evidence-act-1984-pace-codes-of-practice"}], "parent": 27, "page": null}, {"id": 79, "title": "Warrant does not seem to match address", "cat": "Home, entry and property", "situation": "A search warrant is presented and you are confused by the address.", "say": "Could you explain which premises the warrant covers?", "law": "Warrant validity and scope depend on its terms and statutory requirements.", "next": "Ask for the paperwork and a solicitor; do not obstruct a search.", "basis": "PACE ss.15–16; Code B", "refs": [{"name": "Section 15", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/15"}, {"name": "Section 16", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/16"}], "parent": 28, "page": null}, {"id": 80, "title": "Police enter to help someone", "cat": "Home, entry and property", "situation": "Officers say they believe someone inside needs urgent help.", "say": "Is everyone safe? Could you explain the reason for entry?", "law": "PACE s.17 includes entry to save life or limb or prevent serious damage to property.", "next": "Give useful safety information and stay clear.", "basis": "PACE s.17(1)(e)", "refs": [{"name": "Section 17", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/17"}], "parent": 29, "page": null}, {"id": 81, "title": "Property still held months later", "cat": "Home, entry and property", "situation": "An item taken for evidence has not been returned.", "say": "Could you explain why it is still needed and the return process?", "law": "PACE permits retention for specified purposes and only as long as necessary in the circumstances.", "next": "Request a written explanation and seek legal advice if disputed.", "basis": "PACE ss.21–22", "refs": [{"name": "Access", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/21"}, {"name": "Retention", "url": "https://www.legislation.gov.uk/ukpga/1984/60/section/22"}], "parent": 32, "page": null}, {"id": 82, "title": "Passenger in a stopped car", "cat": "Roads and transport", "situation": "You are a passenger during a routine road stop.", "say": "Is there anything you legally need me to do?", "law": "Section 163 applies to the driver; other powers may apply to passengers depending on the circumstances.", "next": "Stay calm and follow safety instructions.", "basis": "Road Traffic Act 1988 s.163; separate powers where applicable", "refs": [{"name": "Section 163", "url": "https://www.legislation.gov.uk/ukpga/1988/52/section/163"}], "parent": 33, "page": null}, {"id": 83, "title": "Driver cannot show documents immediately", "cat": "Roads and transport", "situation": "Police ask the driver for documents not currently available.", "say": "Could you explain what documents are required and how to provide them?", "law": "Sections 164–165 govern production of relevant documents and applicable exceptions or procedures.", "next": "Follow the officer’s lawful directions and official deadlines.", "basis": "Road Traffic Act 1988 ss.164–165", "refs": [{"name": "Section 164", "url": "https://www.legislation.gov.uk/ukpga/1988/52/section/164"}, {"name": "Section 165", "url": "https://www.legislation.gov.uk/ukpga/1988/52/section/165"}], "parent": 34, "page": null}, {"id": 84,
